[project]
name = "fracsched"
version = "1.0.0"
description = "Maintenance scheduling for business jets whose future flight hours are uncertain: a genetic algorithm evaluated across Monte Carlo utilization scenarios, an exact sample-average model, rolling-horizon re-planning, and an out-of-sample comparison with planning for the average."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriel Milanez Cavalheri" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "deap>=1.4",
    "ortools>=9.10",
    "pmo",
    "smallfleet",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "ipykernel>=6.29",
    "mypy>=1.11",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scipy-stubs>=1.13",
]

[tool.uv.sources]
# AVR-04: the GA, decoder and CP-SAT model this project extends
pmo = { git = "https://github.com/GMCavalheri/Preventive-Maintenance-Optimization-with-Genetic-Algorithms", tag = "v1.0.0" }
# EJD-01: the Gamma-Poisson conjugate update behind the Bayesian wear-rate input
smallfleet = { git = "https://github.com/GMCavalheri/bayesian-small-fleet-reliability", tag = "v1.0.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fracsched"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: GA and CP-SAT runs (seconds each); run by default, deselect with -m 'not slow'"]

[tool.coverage.run]
source = ["fracsched"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[[tool.mypy.overrides]]
# pmo, DEAP, OR-Tools, Plotly and smallfleet's PyMC stack ship without usable type information
module = [
    "pmo",
    "pmo.*",
    "deap",
    "deap.*",
    "ortools",
    "ortools.*",
    "plotly",
    "plotly.*",
    "pymc",
    "pymc.*",
    "pytensor",
    "pytensor.*",
    "arviz",
    "arviz.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
# notebooks are generated by notebooks/build_notebooks.py; lint that file instead
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = [
    "E741",  # single-letter math names (l, I) are idiomatic here
]

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebooks.py" = ["E501"]  # notebook cell sources are string literals

[tool.ruff.lint.isort]
# validation/ scripts and tests import their sibling helper modules directly
known-local-folder = ["common", "helpers"]
